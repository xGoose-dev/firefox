name: Submit Firefox Add-ons
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tested GitHub release tag (vX.Y.Z)
        required: true
permissions:
  contents: read
concurrency:
  group: firefox-store-submission
  cancel-in-progress: false
jobs:
  submit:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.19.0'
          cache: npm
      - id: credentials
        name: Check release identity and signing credentials
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          if [[ -z "$WEB_EXT_API_KEY" || -z "$WEB_EXT_API_SECRET" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Firefox not submitted: configure AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets. Use Developer Hub until configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.credentials.outputs.ready == 'true'
        run: npm ci --ignore-scripts
      - if: steps.credentials.outputs.ready == 'true'
        name: Download and verify the tested release
        run: |
          git fetch origin "refs/heads/main:refs/remotes/origin/main" "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" origin/main
          gh release download "$RELEASE_TAG" --dir release-files
          cd release-files
          sha256sum --check SHA256SUMS
          version="${RELEASE_TAG#v}"
          unzip -q "xgoose-firefox-$version.zip" -d ../store-dist
      - if: steps.credentials.outputs.ready == 'true'
        name: Submit listed update and review source to Mozilla
        run: |
          npx web-ext sign --source-dir store-dist --artifacts-dir signed --channel listed --upload-source-code release-files/xgoose-firefox-source.zip --approval-timeout 0
          echo "Mozilla submission accepted. Review/public availability must be confirmed in Developer Hub." >> "$GITHUB_STEP_SUMMARY"
